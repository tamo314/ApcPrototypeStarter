[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apc"
version = "0.1.0"
description = "Adaptive Primitive Consolidation (APC) research prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12,<2.14",
    "pyyaml>=6.0",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
plots = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["apc*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
exclude = ["orchestrator.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["apc"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
