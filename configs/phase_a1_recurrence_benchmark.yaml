# Phase A.1 Post-Diagnostic Task A1-B007 (Milestone B-M7)
# Recurrence & Reuse Benchmark
# Validates that consolidated operations achieve >= 0.90 exact match immediately
# without adaptation and with strictly 0 allocated plastic parameters.

seeds: [0, 1, 2, 3, 4]

vocab_size: 10
sequence_length_range: [6, 10]
group_size: 4

model:
  d_model: 192
  n_layer: 4
  n_head: 4
  d_ff: 768
  max_seq_len: 48
  dropout: 0.0

device: auto

d_operator: 32
n_operator_head: 4
d_operator_ff: 64
max_sequence_length: 32

recurrent_operations: [SWAP_PAIRS, INVERT_HALF]
intervening_operations: [REVERSE, SHIFT, NEGATE]
num_eval_examples: 200
min_eval_examples: 200

num_fresh_adaptation_examples: 1000
fresh_adaptation_steps: 500
fresh_adaptation_lr: 0.001

accuracy_threshold: 0.90
unconsolidated_threshold: 0.05
consolidation_checkpoint_dir: runs/phase_a1_consolidation_benchmark
