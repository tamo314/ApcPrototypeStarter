# Phase A scale-robustness check (Task 014 follow-up), see
# phase_a_scale_check_low.yaml for the full rationale.
# "mid" = ~25.3M parameters (d_model=512, 8 layers).
run_name: phase_a_scale_check_mid
seed: 0
output_dir: runs

data:
  vocab_size: 10
  sequence_length_range: [6, 10]
  max_depth: 2
  novel_composition_fraction: 0.3
  num_examples: 256

model:
  max_seq_len: 64
  d_model: 512
  n_layer: 8
  n_head: 8
  d_ff: 2048
  dropout: 0.0

optim:
  steps: 1500
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 100
  device: auto
  amp: false
