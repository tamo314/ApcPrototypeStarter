# Phase B Task B-C005R2 Functional Adequacy Estimator Repair Configuration
# Uses disjoint development seeds [10, 11, 12, 13, 14] strictly isolated from
# sealed evaluation seeds [0, 1, 2, 3, 4].
seeds: [10, 11, 12, 13, 14]
bank_sizes: [16, 32, 64, 128]
levels:
  - L0_orthogonal
  - L1_random_score_space
  - L2_near_neighbor
  - L3_semantically_related
  - L4_confusable_family
target_operations:
  - SHIFT
  - SELECT
  - COUNT
  - BIND
policies:
  - fixed_32
  - fixed_64
  - fixed_128
  - sequential
support_examples: 128
query_examples: 64
router_train_examples: 32
router_steps: 250
router_lr: 0.005
top_k: 5
ranking_margin: 3.0
ranking_beta: 1.0
arg_lambda: 2.0
adequacy_exact_match_threshold: 0.95
confidence_level: 0.95
initial_support: 32
support_increment: 32
max_support: 128
deterministic_algorithms: true
device: auto
bank_checkpoint_dir: runs/phase_a2_bank_scaling_benchmark
output_dir: runs/phase_b_b2_adequacy_repair
