# Phase A scale-robustness check (Task 014 follow-up): re-run the ADR-0006
# generalization measurement (train vs. held-out "test" split exact match)
# at docs/design-docs/ARCHITECTURE.md section 3's recommended first scale
# (10M-60M parameters), which no prior Phase A experiment had reached.
# "low" = ~14.2M parameters (d_model=384, 8 layers).
run_name: phase_a_scale_check_low
seed: 0
output_dir: runs

data:
  vocab_size: 10
  sequence_length_range: [6, 10]
  max_depth: 2
  novel_composition_fraction: 0.3
  num_examples: 256

model:
  max_seq_len: 64
  d_model: 384
  n_layer: 8
  n_head: 8
  d_ff: 1536
  dropout: 0.0

optim:
  steps: 1500
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  log_every: 100
  device: auto
  amp: false
