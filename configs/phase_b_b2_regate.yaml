# B-C005G: frozen R2 repair evaluated only on a newly designated sealed partition.
sealed_seeds: [20, 21, 22, 23, 24]
development_seeds: [10, 11, 12, 13, 14]
bank_sizes: [16, 32, 64, 128]
levels:
  - L0_orthogonal
  - L1_random_score_space
  - L2_near_neighbor
  - L3_semantically_related
  - L4_confusable_family
target_operations: [SHIFT, SELECT, COUNT, BIND]
support_examples: 128
query_examples: 64
router_train_examples: 32
router_steps: 250
router_lr: 0.005
top_k: 5
ranking_margin: 3.0
ranking_beta: 1.0
arg_lambda: 2.0
adequacy_exact_match_threshold: 0.95
confidence_level: 0.95
initial_support: 32
support_increment: 32
max_support: 128
deterministic_algorithms: true
device: auto
bank_checkpoint_dir: runs/phase_a2_bank_scaling_benchmark
output_dir: runs/phase_b_b2_regate
