# B-C005R3-008: BIND Argument-Scorer Generalization Repair.
# Mandatory pre-repair diagnostics (schema, standard-draw value coverage,
# D2-004-style value/structure/wrong-key-distance/content-length breakdown,
# development-only data-scale control) followed by a scoped repair that
# retrains ONLY ArgumentScorer.heads["BIND"] via a dev-only sampling change
# (larger i.i.d. draw vs. value-coverage-stratified draw, selected on a
# disjoint split). SHIFT/SELECT/COUNT heads, the Router, the verifier, and
# the primitive bank are frozen and measured, not just assumed, to be
# unaffected.
development_seeds: [10, 11, 12, 13, 14]
bank_size: 128
support_examples: 32
query_examples: 64
selection_support_examples: 32
selection_query_examples: 64
router_train_examples: 32
router_steps: 250
router_lr: 0.005
ranking_margin: 3.0
ranking_beta: 1.0
arg_lambda: 2.0
top_k: 5
adequacy_exact_match_threshold: 0.95
repair_pool_examples: 256
repair_training_budget: 128
repair_steps: 300
repair_lr: 0.005
gate_argument_accuracy_threshold: 0.95
gate_full_call_top1_threshold: 0.90
gate_family_top1_threshold: 0.98
gate_topk_threshold: 0.99
gate_other_op_regression_pp_max: 1.0
variants: [larger_iid_sample, stratified_value_coverage]
output_dir: runs/phase_b_b2_post_d2/r3_008_bind_argument_scorer_repair
