[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apc-maniskill"
version = "0.1.0"
description = "Experiment-first embodied APC research workspace"
requires-python = ">=3.11,<3.13"
dependencies = ["mani_skill==3.0.1", "torch", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apc-maniskill = "apc_maniskill.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["maniskill: complete feature test using the real simulator"]
